<svg xmlns="http://www.w3.org/2000/svg" width="640" height="662" viewBox="0 0 640 662" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Make documentation easier to understand</title>
<desc id="desc">One skill. Every Markdown document. Evidence first.: Understand the source. Read the code, document purpose and audience.; Explain with the right visual. Choose clear text, a diagram or an illustration.; Adapt theme and language. Keep meaning and composition across variants.; Verify and report. Separate checked facts from untested assumptions.</desc>
